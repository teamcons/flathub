id: page.codeberg.elly_code.cherrypick
# elementary SDK is not available on Flathub, so use the elementary BaseApp instead
base: io.elementary.BaseApp
base-version: 'tanit-26.08'
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: page.codeberg.elly_code.cherrypick

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/vala

# Cleanup development-related files inherited from the BaseApp to reduce package size of your app.
cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: cherrypick
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: git
        url: https://codeberg.org/elly-code/cherrypick.git
        tag: 2.5.0
        commit: 604d9182dbf5ef0b1d2fd2ec5a01bdf30d1c18cd
        x-checker-data:
          type: git
          tag-pattern: '^([\d.]+)$'